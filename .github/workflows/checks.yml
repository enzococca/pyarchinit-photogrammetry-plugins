name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # the program with the plugin system, from PyPI: 1.3.3 has context.on_refresh and the drawing fix the plugins need
  PPG_APP: "pyarchinit-photogrammetry[gui,postgis]>=1.3.3"
  # masonry needs 1.7.0 (drawings kept with the elevations): the program from its development branch until 1.7.0 is on
  # PyPI, then PPG_APP again
  # mesh: Open3D, so the elevations of masonry are ray cast by Open3D as in the app; without it the program falls
  # back to trimesh's rays, which is far slower and has twice brought the runner down
  PPG_APP_DEV: "pyarchinit-photogrammetry[gui,postgis,bim,mesh] @ git+https://github.com/enzococca/pyarchinit-photogrammetry.git@assistant"
  PPG_NO_UPDATE_CHECK: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  index:
    name: index and wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite libegl1 libgl1 libgomp1
      - name: The program
        run: python -m pip install "$PPG_APP" jsonschema
      - name: Index, wheels, plugins started by the program
        run: python scripts/check_index.py --load

  plugins:
    name: tests of ${{ matrix.plugin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        plugin: [plugins/architecture, plugins/blender-em, plugins/geoarchaeology, plugins/geophysics, plugins/gis-archive, plugins/masonry, plugins/mesh-tools,
                 plugins/powerlines, plugins/samgeo, plugins/geoai, plugins/landscape, plugins/sentinel2, plugins/shipwreck, plugins/spirula,
                 plugins/terrain, plugins/terrio, plugins/underwater, template]
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ppg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PPG_TEST_POSTGIS_URL: postgresql://postgres:ppg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        # libopengl0: the GLU that pymeshlab's wheel carries links libOpenGL.so.0, which neither the wheel nor
        # libgl1 brings; without it MeshLab's PLY reader and meshing filters do not load (mesh-tools)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite libegl1 libgl1 libgomp1 libopengl0
      - name: The program and the plugin
        run: |
          app="$PPG_APP"
          if [ "${{ matrix.plugin }}" = "plugins/masonry" ]; then app="$PPG_APP_DEV"; fi
          python -m pip install "$app" pytest -e "${{ matrix.plugin }}"
      - name: MeshLab for the tests of mesh-tools (its other tests run without it)
        if: matrix.plugin == 'plugins/mesh-tools'
        run: python -m pip install pymeshlab
      - name: Blender for the tests of blender-em (its other tests run without it)
        # bpy, Blender as a Python module, has wheels for Python 3.13 only: an environment of its own, made by uv;
        # the tests run the live script in it as the plugin runs Blender, in a process of its own
        if: matrix.plugin == 'plugins/blender-em'
        run: |
          python -m pip install uv
          uv venv -p 3.13 "$RUNNER_TEMP/bpy"
          VIRTUAL_ENV="$RUNNER_TEMP/bpy" uv pip install "bpy==5.2.*"
          echo "PPG_TEST_BLENDER=$RUNNER_TEMP/bpy/bin/python" >> "$GITHUB_ENV"
      - name: Landlab for the tests of landscape (its other tests run without it)
        # Landlab, richdem and netCDF4 in an environment of their own, made by uv, as the plugin makes it: the
        # program never imports them; PPG_TEST_LANDLAB names its Python for the tests of the real worker
        if: matrix.plugin == 'plugins/landscape'
        run: |
          python -m pip install uv
          uv venv -p 3.12 "$RUNNER_TEMP/landlab"
          VIRTUAL_ENV="$RUNNER_TEMP/landlab" uv pip install "landlab>=2.9,<3" numpy pytest
          echo "PPG_TEST_LANDLAB=$RUNNER_TEMP/landlab/bin/python" >> "$GITHUB_ENV"
      - name: The simulations of landscape, in the Python that has Landlab
        if: matrix.plugin == 'plugins/landscape'
        run: '"$PPG_TEST_LANDLAB" -m pytest -q -p no:cacheprovider plugins/landscape/tests'
      - name: LoopStructural for the tests of geoarchaeology (its other tests run without it)
        # the environment the plugin makes for the user, by the plugin's own two commands: the libraries, then
        # LoopStructural with --no-deps, no VTK; the program never imports it; PPG_TEST_LOOP names its Python
        if: matrix.plugin == 'plugins/geoarchaeology'
        run: |
          python -m pip install uv
          uv venv -p 3.12 "$RUNNER_TEMP/loop"
          python - <<'PY'
          import os, shutil, subprocess
          from pathlib import Path
          from ppg_geoarchaeology.environment import commands
          for command in commands(Path(shutil.which("uv")), Path(os.environ["RUNNER_TEMP"]) / "loop/bin/python"):
              subprocess.run(command, check=True)
          PY
          VIRTUAL_ENV="$RUNNER_TEMP/loop" uv pip install pytest
          echo "PPG_TEST_LOOP=$RUNNER_TEMP/loop/bin/python" >> "$GITHUB_ENV"
      - name: The engine of geoarchaeology, in the Python that has LoopStructural
        if: matrix.plugin == 'plugins/geoarchaeology'
        run: '"$PPG_TEST_LOOP" -m pytest -q -p no:cacheprovider plugins/geoarchaeology/tests/test_implicit_engine.py'
      - name: The uv cache of CadQuery's environment (architecture)
        if: matrix.plugin == 'plugins/architecture'
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-architecture-${{ hashFiles('plugins/architecture/ppg_architecture/environment.py') }}
      - name: CadQuery for the tests of architecture (its other tests run without it)
        # the environment the plugin installs for the user, by environment.install itself (the libraries, then
        # CadQuery, OpenCascade and VTK with --no-deps, casadi left out): the program never imports it;
        # PPG_TEST_CADQUERY names its Python for the tests of the real worker. About 900 MB: in this job only
        if: matrix.plugin == 'plugins/architecture'
        run: |
          sudo apt-get install -y libxrender1 libxt6 libxcursor1 libxinerama1 libxft2
          python -m pip install uv "ifcopenshell>=0.8"
          python - <<'PY'
          import os
          from pathlib import Path
          from ppg_architecture import environment
          env = Path(os.environ["RUNNER_TEMP"]) / "cadquery"
          environment.install(lambda f, m: print(f"{f * 100:5.1f} % {m}", flush=True), env=env)
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"PPG_TEST_CADQUERY={environment.env_python(env)}\n")
          PY
      - name: s3dgraphy for the em.json test of blender-em
        if: matrix.plugin == 'plugins/blender-em'
        run: python -m pip install --pre "s3dgraphy>=1.6.0.dev40"
      - name: Tests
        # a test that hangs dumps every thread's stack after 10 minutes instead of holding the job
        run: python -X faulthandler -m pytest -q -p no:cacheprovider -o faulthandler_timeout=600 "${{ matrix.plugin }}/tests"
