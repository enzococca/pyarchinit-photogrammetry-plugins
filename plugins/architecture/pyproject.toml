[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-architecture"
version = "0.2.1"
description = """\
pyarchinit-photogrammetry plugin: parametric architectural elements from the photogrammetric model - columns by \
revolution, mouldings swept along a path, arches and barrel vaults from a section, doors and windows - as STEP \
(CadQuery, in a process of its own) and parametric IFC, each with its distance from the model"""
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
# CadQuery runs in an environment of its own, installed by the plugin; the rest comes with the program
dependencies = []

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry-plugins/tree/main/plugins/architecture"

[project.entry-points."pyarchinit_photogrammetry.plugins"]
architecture = "ppg_architecture:ArchitecturePlugin"

[tool.setuptools]
packages = ["ppg_architecture"]
