[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-blender-em"
version = "0.1.0"
description = "pyarchinit-photogrammetry plugin: the unit proxies and the survey in Blender and in EMtools' Extended Matrix (em.json), kept up to date, and the selection shared with EMtools 1.6"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
# nothing the program does not already carry: the em.json is read as JSON, the WebSocket of EMtools
# is spoken with the standard library, Blender runs blender_live.py in its own Python
dependencies = []

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry-plugins/tree/main/plugins/blender-em"

[project.entry-points."pyarchinit_photogrammetry.plugins"]
blender-em = "ppg_blender_em:BlenderEmPlugin"

[tool.setuptools]
packages = ["ppg_blender_em"]
