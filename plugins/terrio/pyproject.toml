[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-terrio"
version = "0.2.0"
description = "pyarchinit-photogrammetry plugin: point clouds (LAS, LAZ, COPC, EPT, PLY, E57), ground classification, cleaning, colours and values from rasters, geoid heights and web rasters (Planetary Computer) through terrio, without GDAL or PDAL"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
# terrio is a compiled wheel (pure Rust, no C library): pip installs it here; the packaged
# application, which has no pip, downloads it from PyPI into the plugin folder (Installa terrio)
# the steps of 0.2.0 (cleaning, colours, heights, Planetary Computer) need terrio 0.5; an older terrio in the
# plugin folder still runs the others and the window offers to update it
dependencies = ["terrio>=0.5,<0.6"]

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry-plugins/tree/main/plugins/terrio"

[project.entry-points."pyarchinit_photogrammetry.plugins"]
terrio = "ppg_terrio:TerrioPlugin"

[tool.setuptools]
packages = ["ppg_terrio"]
