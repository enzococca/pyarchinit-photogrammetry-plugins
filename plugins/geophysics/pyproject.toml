[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-geophysics"
version = "0.1.1"
description = "pyarchinit-photogrammetry plugin: geophysical grids (magnetometry, resistivity, GPR, EM) imported, georeferenced, filtered, overlaid on the orthomosaic and DEM, exported"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
# nothing the program does not already carry (numpy, SciPy, rasterio, shapely): the packaged application has no pip
dependencies = []

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry-plugins/tree/main/plugins/geophysics"

[project.entry-points."pyarchinit_photogrammetry.plugins"]
geophysics = "ppg_geophysics:GeophysicsPlugin"

[tool.setuptools]
packages = ["ppg_geophysics"]
