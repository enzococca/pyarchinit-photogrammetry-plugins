[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-underwater"
version = "0.1.0"
description = "pyarchinit-photogrammetry plugin: underwater surveys - colours restored with the range of every pixel from the depth maps (Sea-thru) or a quick correction before the alignment, blurred, hazy and low-contrast photos flagged, sharp and well-spaced frames from videos and fast image sequences, depth logs (ROV pressure sensor, dive computer CSV, UDDF) that level and scale the chunk"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
# numpy, SciPy, OpenCV, Pillow and pycolmap come with the program: nothing beyond it
dependencies = []

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry-plugins/tree/main/plugins/underwater"

[project.entry-points."pyarchinit_photogrammetry.plugins"]
underwater = "ppg_underwater:UnderwaterPlugin"

[tool.setuptools]
packages = ["ppg_underwater"]
