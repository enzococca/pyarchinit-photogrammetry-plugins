[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-shipwreck"
version = "0.1.0"
description = "pyarchinit-photogrammetry plugin: the technical drawing of an excavated hull from its 3D model - ship frame, stations, sections cut from the model, a stated water correction, body plan, half-breadth plan, profile, plan, timber catalogue"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
dependencies = []  # all it uses comes with the program

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry-plugins/tree/main/plugins/shipwreck"

[project.entry-points."pyarchinit_photogrammetry.plugins"]
shipwreck = "ppg_shipwreck:ShipwreckPlugin"

[tool.setuptools]
packages = ["ppg_shipwreck"]
